<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Microcassette</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Subtle background grid pattern */
    .bg-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
    /* Glass card effect */
    .glass {
      background: rgba(18, 22, 31, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-btn {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
    }
    .glass-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-[#0a0c10] text-slate-100 w-screen h-screen overflow-hidden flex items-center justify-center relative bg-grid">

  <!-- Ambient Glow Effects -->
  <div class="absolute w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none -top-20 -left-20"></div>
  <div class="absolute w-[500px] h-[500px] bg-red-500/10 rounded-full blur-[140px] pointer-events-none -bottom-20 -right-20"></div>

  <main class="relative z-10 flex flex-col items-center gap-8 px-6 text-center max-w-xl w-full">
    
    <!-- Title & Subtitle -->
    <div class="space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass border border-white/10 text-[11px] mono text-slate-400 mb-1">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse"></span>
        3D MODEL SELECTION
      </div>
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-white">
        Choose a Microcassette
      </h1>
      <p class="text-xs sm:text-sm text-slate-400 font-normal">
        Select a cassette below to open the 3D interactive viewer.
      </p>
    </div>

    <!-- The 2 Centered Buttons -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full">
      
      <!-- Button 1: Compact Microcassette -->
      <button 
        id="btn-compact" 
        class="glass-btn group relative p-6 rounded-2xl flex flex-col items-start text-left shadow-xl hover:shadow-emerald-500/10">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 mb-4 transition-transform group-hover:scale-105">
          <!-- Tape Cassette Icon -->
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <rect x="2" y="5" width="20" height="14" rx="3" stroke-width="1.8"/>
            <circle cx="8" cy="12" r="2.2" stroke-width="1.8"/>
            <circle cx="16" cy="12" r="2.2" stroke-width="1.8"/>
            <path stroke-linecap="round" stroke-width="1.8" d="M10.2 12h3.6"/>
          </svg>
        </div>
        <div class="space-y-1 w-full">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-white tracking-wide">IMC Record Production</span>
            <span class="text-emerald-400 group-hover:translate-x-1 transition-transform">→</span>
          </div>
          <p class="text-xs text-slate-400">Compact Cassette</p>
        </div>
      </button>

      <!-- Button 2: Sony MC-60 Microcassette -->
      <button 
        id="btn-sony" 
        class="glass-btn group relative p-6 rounded-2xl flex flex-col items-start text-left shadow-xl hover:shadow-red-500/10">
        <div class="w-10 h-10 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400 mb-4 transition-transform group-hover:scale-105">
          <!-- Tape Cassette Icon -->
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <rect x="2" y="5" width="20" height="14" rx="3" stroke-width="1.8"/>
            <circle cx="8" cy="12" r="2.2" stroke-width="1.8"/>
            <circle cx="16" cy="12" r="2.2" stroke-width="1.8"/>
            <path stroke-linecap="round" stroke-width="1.8" d="M10.2 12h3.6"/>
          </svg>
        </div>
        <div class="space-y-1 w-full">
          <div class="flex items-center justify-between">
            <span class="text-sm font-semibold text-white tracking-wide">Sony MC-60</span>
            <span class="text-red-400 group-hover:translate-x-1 transition-transform">→</span>
          </div>
          <p class="text-xs text-slate-400">Microcassette</p>
        </div>
      </button>

    </div>

  </main>

  <!-- Subtle Quick-Edit Link Button (bottom right corner) -->
  <button 
    id="btn-open-settings" 
    class="fixed bottom-5 right-5 z-20 w-9 h-9 rounded-xl glass flex items-center justify-center text-slate-400 hover:text-white transition shadow-lg"
    title="Edit Viewer URLs">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
    </svg>
  </button>

  <!-- URL Settings Modal (hidden until gear is clicked) -->
  <div id="settings-modal" class="fixed inset-0 z-30 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="glass max-w-sm w-full p-5 rounded-2xl border border-white/10 shadow-2xl text-left space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <h2 class="text-sm font-semibold text-white">Configure Viewer Links</h2>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white text-xs">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">Compact Microcassette URL:</label>
          <input 
            id="url-compact-input" 
            type="text" 
            placeholder="https://your-viewer.com/compact" 
            class="w-full bg-slate-900/90 border border-white/10 rounded-lg px-3 py-2 text-white mono text-xs focus:outline-none focus:border-white/30"
          />
        </div>

        <div>
          <label class="block text-slate-300 font-medium mb-1">Sony MC-60 URL:</label>
          <input 
            id="url-sony-input" 
            type="text" 
            placeholder="https://your-viewer.com/sony-mc60" 
            class="w-full bg-slate-900/90 border border-white/10 rounded-lg px-3 py-2 text-white mono text-xs focus:outline-none focus:border-white/30"
          />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button id="btn-save-links" class="w-full bg-white text-slate-950 font-semibold py-2 rounded-lg hover:bg-slate-200 transition text-xs">
          Save Links
        </button>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // PASTE YOUR VIEWER URLS HERE:
    // ========================================================
    const DEFAULT_LINKS = {
      compact: "https://beffstick.github.io/3DView-IMC_Record_Compact_Cassette/",  // <-- Put your Compact link here
      sony: "https://beffstick.github.io/3DView-Sony_MC-60_Microcassette/"     // <-- Put your Sony MC-60 link here
    };

    // Load saved URLs from localStorage or use defaults above
    function getLinks() {
      try {
        const saved = localStorage.getItem('microcassette_urls');
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return { ...DEFAULT_LINKS };
    }

    function saveLinks(compactUrl, sonyUrl) {
      const data = {
        compact: compactUrl.trim() || DEFAULT_LINKS.compact,
        sony: sonyUrl.trim() || DEFAULT_LINKS.sony
      };
      try {
        localStorage.setItem('microcassette_urls', JSON.stringify(data));
      } catch (e) {}
      return data;
    }

    // Elements
    const btnCompact = document.getElementById('btn-compact');
    const btnSony = document.getElementById('btn-sony');
    const btnSettings = document.getElementById('btn-open-settings');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnSaveLinks = document.getElementById('btn-save-links');
    const modal = document.getElementById('settings-modal');
    const inputCompact = document.getElementById('url-compact-input');
    const inputSony = document.getElementById('url-sony-input');

    // Click handler for opening links
    btnCompact.addEventListener('click', () => {
      const links = getLinks();
      window.open(links.compact, '_blank');
    });

    btnSony.addEventListener('click', () => {
      const links = getLinks();
      window.open(links.sony, '_blank');
    });

    // Settings Modal handlers
    btnSettings.addEventListener('click', () => {
      const links = getLinks();
      inputCompact.value = links.compact;
      inputSony.value = links.sony;
      modal.classList.remove('hidden');
    });

    btnCloseModal.addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    btnSaveLinks.addEventListener('click', () => {
      saveLinks(inputCompact.value, inputSony.value);
      modal.classList.add('hidden');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });
  </script>
</body>
</html>
